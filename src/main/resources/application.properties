spring.application.name=employee-ms-prac
spring.config.import=optional:configserver:
spring.cloud.config.discovery.enabled=true
spring.cloud.config.discovery.service-id=CONFIG-SERVER-MS-PRAC
spring.cloud.bus.enabled=true
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
#properties to enable tracing
management.tracing.enabled=true
#Matlab kitne % request has to be traced Here it  means saaree requests will be traced(100%)
management.tracing.sampler.probability=1.0
management.zipkin.trace.enabled=true
#Actuallly Yahn humme Health karna hai
management.endpoints.web.exposure.include=*
#By Default health details are not shown, to show them always use below property. Database ki status,CircuitBreaker ki Status etc sab show karega
management.endpoint.health.show-details=always
management.health.circuitbreakers.enabled=true
management.health.circuitbreakers.enabled:true
management.health.ratelimiters.enabled:true
#Adding Circuit Breaker Properties
resilience4j.circuitbreaker.instances.deptBreaker.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.deptBreaker.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.deptBreaker.slidingWindowSize=5
resilience4j.circuitbreaker.instances.deptBreaker.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.deptBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.deptBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.deptBreaker.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.deptBreaker.automaticTransitionFromOpenToHalfOpenEnabled=true




